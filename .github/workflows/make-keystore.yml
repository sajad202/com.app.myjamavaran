name: Create Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Jamavaran2024SecureKey \
            -keypass Jamavaran2024SecureKey \
            -dname "CN=Jamavaran, OU=Dev, O=Jamavaran, L=Tehran, ST=Tehran, C=IR"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.jks
