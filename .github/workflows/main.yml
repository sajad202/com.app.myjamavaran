name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Write Gradle files (self-healing)
        run: |
          cat > build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          ROOT
          cat > settings.gradle <<'SET'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JamavaranApp"
          include ':app'
          SET
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS
          cat > app/build.gradle <<'APP'
          plugins {
              id 'com.android.application' version '8.5.2'
              id 'org.jetbrains.kotlin.android' version '1.9.24'
              id 'com.google.gms.google-services' version '4.4.2'
          }

          android {
              namespace 'com.app.myjamavaran'
              compileSdk 34

              defaultConfig {
                  applicationId "com.app.myjamavaran"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.0.1"

                  buildConfigField "boolean", "ALLOW_HTTP", "false"
                  buildConfigField "boolean", "EXTERNAL_IN_APP", "false"
                  buildConfigField "boolean", "PULL_REFRESH", "true"
                  buildConfigField "boolean", "UPLOAD_ENABLED", "true"
                  buildConfigField "boolean", "DOWNLOADS_ENABLED", "true"
                  buildConfigField "boolean", "ZOOM_ENABLED", "false"
                  buildConfigField "String", "REST_BASE", "\"https://my.fc-jamavaran.ir/admin/appsaz/\""
                  buildConfigField "String", "APP_KEY", "\"JV70ec9cac190e475a\""
                  buildConfigField "String", "CUSTOM_CSS", "\"\""
                  buildConfigField "String", "CUSTOM_JS", "\"\""
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file("keystore.jks")
                      storePassword "Jamavaran2024SecureKey"
                      keyAlias "upload"
                      keyPassword "Jamavaran2024SecureKey"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              buildFeatures { buildConfig true }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
              implementation 'com.google.firebase:firebase-messaging:24.0.0'
          }
          APP

      - name: Build Release APK (Signed)
        run: gradle assembleRelease --no-daemon

      - name: Build Release AAB (Signed)
        run: gradle bundleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-signed
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Debug info (only if failed)
        if: failure()
        run: |
          echo "=== app/build.gradle (lines 1-12) ==="
          head -12 app/build.gradle
          echo "=== package check ==="
          grep -o '"package_name": "[^"]*"' app/google-services.json
