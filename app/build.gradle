plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
    id 'com.google.gms.google-services' version '4.4.2'
}

android {
    namespace 'ir.fcjamavaran.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.fcjamavaran.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        buildConfigField "boolean", "ALLOW_HTTP", "false"
        buildConfigField "boolean", "EXTERNAL_IN_APP", "false"
        buildConfigField "boolean", "PULL_REFRESH", "true"
        buildConfigField "boolean", "UPLOAD_ENABLED", "true"
        buildConfigField "boolean", "DOWNLOADS_ENABLED", "true"
        buildConfigField "boolean", "ZOOM_ENABLED", "false"
        buildConfigField "String", "REST_BASE", "\"https://my.fc-jamavaran.ir/admin/appsaz/\""
        buildConfigField "String", "APP_KEY", "\"JV70ec9cac190e475a\""
        buildConfigField "String", "CUSTOM_CSS", "\"\""
        buildConfigField "String", "CUSTOM_JS", "\"\""
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore.jks")
            storePassword "Jamavaran2024SecureKey"
            keyAlias "upload"
            keyPassword "Jamavaran2024SecureKey"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
}
